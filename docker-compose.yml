services:
  postgres:
    image: postgres:16
    container_name: titancrm_postgres
    restart: always

    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan123
      POSTGRES_DB: titancrm

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titancrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: titancrm_api
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg2://titan:titan123@postgres:5432/titancrm
      SECRET_KEY: titancrm-docker-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    ports:
      - "8000:8000"

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data: