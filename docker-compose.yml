services:
  postgres:
    image: postgres:16
    container_name: titancrm_postgres

    restart: always

    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan123
      POSTGRES_DB: titancrm

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: